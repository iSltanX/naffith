<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- الخطوط الحرجة: ستّة ملفّاتٍ من سبعة عشر، هي ما تحتاجه شاشة الترحيب عند
       أول رسم. تُحقن الوسوم هنا وقت البناء لأن أسماء الملفّات مبصومة بمحتواها
       فلا تُكتب باليد — انظر `preloadCriticalFonts` في `vite.config.ts`
       و`src/critical-fonts.ts` لسبب اختيار الستّة دون غيرها.
       موضعها هنا لا في مقدّمة `<head>`: بعد `charset` كي لا يُزاح عن أول 1024
       بايت، وقبل `<link>` الأنماط كي يسبق طلبُ الخطّ تحليلَ CSS. -->
  <!--@preload-critical-fonts-->

  <!-- ‏`tokens.css` يقلب اللوحة عند `prefers-color-scheme: dark`، ولا ملفّ في
       المشروع يعلن `color-scheme`. فكان أثاث المتصفّح — أشرطة التمرير وحقول
       النموذج الأصلية وخلفية المستند قبل وصول الأنماط — يبقى نهاريًّا فوق سطحٍ
       ليليّ. الإعلان هنا لا في CSS كي يسري قبل أول بايت من الأنماط، فلا وميض
       أبيض عند الإقلاع في الوضع الليلي.
       ‏`light dark` لا `dark` وحده: التطبيق يتبع النظام ولا يفرض وضعًا. -->
  <meta name="color-scheme" content="light dark">
  <title>نَفِّذ</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
