<!-- ── SYSTEM ──────────────────────────────────────────────────────────── -->
<!-- compress: both arrows travel INWARD toward the seam. The mirror of this
     icon (arrows outward) is extract — they must never be confused. -->
<symbol id="i-compress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3.75 12h6.5M6.75 9l3.5 3-3.5 3"/>
