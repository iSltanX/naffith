<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- ============================================================================
     نَفِّذ — سَطْر · Icon System
     24 x 24 grid · 20 x 20 live area (2px padding) · stroke 1.5
     round caps · round joins · 2px corner radius on rectangular forms
     Single stroke colour: every icon paints with currentColor. Status is
     conveyed by the icon's SHAPE, never by its colour alone.

     MIRRORING IS A CONSUMER DECISION, NOT A SYMBOL PROPERTY: <use> shadow
     content cannot be targeted by CSS, so put data-directional on the consuming
     <svg>, never here. Mirror chevron / execute / external / file-move; never
     mirror clock, lock, search, trash, disk, check, or the brand mark.
     ========================================================================= -->
<!-- ── NAVIGATION ──────────────────────────────────────────────────────── -->
<symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3.5 10.4 12 3.8l8.5 6.6V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19z"/>
  <path d="M9.5 20.5v-5.6a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v5.6"/>
</symbol>

<symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="10.5" cy="10.5" r="6.75"/>
  <path d="m15.4 15.4 4.85 4.85"/>
</symbol>

<symbol id="i-categories" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
  <rect x="3.75" y="3.75" width="7.5" height="7.5" rx="2"/>
  <rect x="12.75" y="3.75" width="7.5" height="7.5" rx="2"/>
  <rect x="3.75" y="12.75" width="7.5" height="7.5" rx="2"/>
  <rect x="12.75" y="12.75" width="7.5" height="7.5" rx="2"/>
</symbol>

<symbol id="i-favorites" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
  <path d="M12.00 4.00 14.09 9.53 19.99 9.80 15.38 13.50 16.94 19.20 12.00 15.95 7.06 19.20 8.62 13.50 4.01 9.80 9.91 9.53Z"/>
</symbol>

<!-- history = a clock that has been wound BACK. The reversing arc is what
     separates it from i-pending, which is the same clock going forward. -->
<symbol id="i-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3.9 9.4A8.25 8.25 0 1 1 3.75 12"/>
  <path d="M3.75 4.9v4.6h4.6"/>
  <path d="M12 7.75V12l3 1.85"/>
</symbol>

<!-- Sliders rather than a gear: calmer, and it echoes the line motif. -->
<symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
  <path d="M3.75 7h11M18.25 7h2M3.75 12h4M11.25 12h9M3.75 17h9M16.25 17h4"/>
  <circle cx="16.25" cy="7" r="2"/>
  <circle cx="9.25" cy="12" r="2"/>
  <circle cx="14.25" cy="17" r="2"/>
</symbol>

